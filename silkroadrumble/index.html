  <!-- ==================================================================
       REKLAMA (daromad)

       A) PLAYGAMA BRIDGE — ULANGAN, hech narsa qilish shart emas.
          O'yin Playgama'ga (va u orqali boshqa portallarga) yuklanganda
          interstitial va mukofotli reklama portalning o'zi orqali chiqadi.
          Sozlama: shu papkadagi playgama-bridge-config.json.
          O'z saytingizda / kompyuterda Bridge "mock" rejimida bo'ladi —
          u yerda reklama uchun pastdagi Monetag ishlatiladi.

       B) O'Z SAYTINGIZ (tapvora.github.io) — ULANGAN:
          Mukofotli: Monetag Direct Link (zona 12195927). Provayder to'sgan bo'lsa
          avtomatik Tapvora Games o'z reklamasi (Astro Dodge) 5 soniya ko'rsatiladi.
          O'yinlar orasida: o'z reklamamiz 5 soniya.
          Faqat o'z saytingizda / localhost'da ishlaydi (portallarda emas).

       C) BANNER (daromad) — sahifa pastidagi "BANNER KODLARI" bo'limida
          3 ta <template> bor: Adsterra 728x90, Adsterra 320x50, Monetag In-Page Push.
          Bo'sh qolsa — o'rniga Tapvora Games banneri (Astro Dodge) chiqadi.
          Banner faqat MENYUDA ko'rinadi, o'yin paytida yashiriladi.
       ================================================================== -->

  <style>
    html, body { margin: 0; height: 100%; background: #1a1612; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f1e6cf;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      overscroll-behavior: none; }
    #page { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    #stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #unity-container { position: relative; background: #231f20; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #231f20; touch-action: none; outline: none; }

    /* Yuklanish oynasi */
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; background: #231f20; z-index: 5; }
    #loading h1 { margin: 0; font-size: clamp(22px, 5vw, 48px); letter-spacing: .04em; color: #e8b84a; text-align: center; padding: 0 12px; }
    #bar { width: min(60%, 420px); height: 12px; border-radius: 6px; background: #3a332d; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #1fa7a0, #e8b84a); transition: width .15s; }
    #loadtxt { font-size: 14px; opacity: .8; }
    #err { display: none; color: #ff8a7a; padding: 0 16px; text-align: center; }

    #fs { position: absolute; right: 8px; top: 8px; z-index: 6; width: 40px; height: 40px; border-radius: 8px;
      border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 20px; cursor: pointer; opacity: 0; transition: opacity .2s; }
    #unity-container:hover #fs { opacity: 1; }
    @media (pointer: coarse) { #fs { display: none; } }

    /* Banner o'yin ostida (o'yin tugmalarini yopmaydi). Bo'sh bo'lsa yashirin */
    #ad-banner-bottom { flex: 0 0 auto; text-align: center; padding: 6px 0; background: #1a1612; max-height: 110px; overflow: hidden; }
    #ad-banner-bottom:empty { display: none; }
    #ad-banner-bottom iframe { border: 0; display: block; margin: 0 auto; max-width: 100%; }
    .hb { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 10px; max-width: 94%;
      background: linear-gradient(90deg, #0d1b3a, #24124a); border: 1px solid #4b3a7a; color: #e6efff;
      text-decoration: none; font-size: 15px; }
    .hb b { color: #7fd7ff; letter-spacing: .04em; }
    .hb-tag { font-size: 10px; letter-spacing: .12em; opacity: .65; }
    .hb-go { background: #7fd7ff; color: #0d1b3a; font-weight: 700; padding: 3px 10px; border-radius: 6px; font-size: 13px; }
    @media (max-height: 520px) { #ad-banner-bottom { display: none; } }

    /* Mukofotli reklama oynasi */
    #rw { display: none; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.7);
      align-items: center; justify-content: center; padding: 16px; }
    .rw-card { background: #2b241e; border: 2px solid #e8b84a; border-radius: 16px; padding: 22px 24px;
      max-width: 420px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    .rw-title { font-size: 26px; font-weight: 700; color: #e8b84a; margin-bottom: 10px; }
    #rw-msg { font-size: 17px; line-height: 1.4; margin-bottom: 18px; }
    .rw-btns { display: flex; flex-direction: column; gap: 10px; }
    .rw-btns button { font: inherit; font-size: 17px; font-weight: 600; padding: 12px; border-radius: 10px;
      border: 0; cursor: pointer; background: linear-gradient(90deg, #1fa7a0, #e8b84a); color: #1a1612; }
    .rw-btns button:disabled { opacity: .45; cursor: default; }
    #rw-house { display: none; margin: 0 0 14px; padding: 14px; border-radius: 12px;
      background: linear-gradient(160deg, #0d1b3a, #24124a); border: 1px solid #4b3a7a; }
    .hz-tag { font-size: 11px; letter-spacing: .12em; opacity: .7; }
    .hz-sky { position: relative; height: 70px; overflow: hidden; }
    .hz-rocket { position: absolute; left: 50%; top: 14px; font-size: 40px; transform: translateX(-50%) rotate(-45deg);
      animation: hzBob 1.2s ease-in-out infinite; }
    .hz-m { position: absolute; font-size: 22px; color: #ffb35c; animation: hzFall 1.6s linear infinite; }
    .hz-m.m1 { left: 20%; } .hz-m.m2 { left: 75%; animation-delay: .8s; }
    @keyframes hzBob { 50% { transform: translateX(-50%) translateY(-6px) rotate(-45deg); } }
    @keyframes hzFall { from { top: -30px; } to { top: 80px; } }
    .hz-name { font-size: 26px; font-weight: 800; color: #7fd7ff; letter-spacing: .06em; }
    .hz-sub { font-size: 14px; opacity: .85; margin: 4px 0 10px; }
    #rw-play { display: inline-block; padding: 6px 14px; border-radius: 8px; background: #7fd7ff; color: #0d1b3a;
      font-weight: 700; text-decoration: none; font-size: 14px; }
    .rw-btns .rw-sec { background: transparent; color: #f1e6cf; border: 1px solid #6b5d50; }

    /* Telefon tik turgan bo'lsa — yotqizishni so'raymiz */
    #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #231f20; color: #e8b84a;
      flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center;
      font-size: 20px; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { body:not(.rot-ok) #rotate { display: flex; } }
    .rot-ico { font-size: 54px; animation: rotTurn 1.8s ease-in-out infinite; }
    @keyframes rotTurn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
    #rot-play { font: inherit; font-size: 20px; font-weight: 700; border: 0; border-radius: 12px; padding: 14px 26px;
      background: linear-gradient(90deg, #1fa7a0, #e8b84a); color: #1a1612; cursor: pointer; }
    #rot-skip { font: inherit; font-size: 15px; background: none; border: 0; color: #f1e6cf; opacity: .7;
      text-decoration: underline; cursor: pointer; }

  <!-- ===================== TIL (UZ / EN) =====================
       Sahifa yozuvlari o'yin tilida. Til: localStorage "srr_lang" (o'yin o'zi yozadi —
       Loc.cs → WebLang.jslib), bo'lmasa brauzer tili: uz → o'zbekcha, qolgani → inglizcha.
       O'yinda til almashsa WebLang.jslib window.srrApplyLang() ni chaqiradi.            -->
  <script>
    var SRR_TXT = {
      uz: {
        loading: 'Yuklanmoqda… ', loadFail: "Yuklab bo'lmadi: ", fullscreen: "To'liq ekran",
        adTag: 'REKLAMA · TAPVORA GAMES', houseSub: 'Kosmosda meteorlardan qoching! Bepul, brauzerda.', play: "O'ynash ↗",
        openAd: 'Reklamani ochish ▶', claim: 'Bonusni olish', claim3: 'Bonusni olish (+3)', cancel: 'Bekor qilish',
        adLoading: 'Reklama yuklanmoqda…', adWatch: "Reklamani ko'ring va keyingi o'yinga +3 bonus ochko oling!",
        adOpened: 'Reklama yangi oynada ochildi… ', adCountdown: 'Reklama… ', thanks: 'Rahmat!', thanksClaim: 'Rahmat! Bonusni oling.',
        adTitle: 'Reklama', cont: 'Davom etish ▶',
        rotate: "O'yin gorizontal ekranda o'ynaladi", rotPlay: "▶ To'liq ekranda o'ynash", rotSkip: 'Shunday davom etish',
        bannerTag: 'REKLAMA', bannerText: 'kosmosda meteorlardan qoching!'
      },
      en: {
        loading: 'Loading… ', loadFail: 'Failed to load: ', fullscreen: 'Full screen',
        adTag: 'AD · TAPVORA GAMES', houseSub: 'Dodge meteors in space! Free, in your browser.', play: 'Play ↗',
        openAd: 'Open the ad ▶', claim: 'Claim bonus', claim3: 'Claim bonus (+3)', cancel: 'Cancel',
        adLoading: 'Loading ad…', adWatch: 'Watch an ad and get +3 bonus points in the next game!',
        adOpened: 'The ad opened in a new tab… ', adCountdown: 'Ad… ', thanks: 'Thank you!', thanksClaim: 'Thank you! Claim your bonus.',
        adTitle: 'Ad', cont: 'Continue ▶',
        rotate: 'This game is played in landscape', rotPlay: '▶ Play full screen', rotSkip: 'Continue anyway',
        bannerTag: 'AD', bannerText: 'dodge meteors in space!'
      }
    };
    window.SRR_LANG = (function () {
      var l = '';
      try { l = localStorage.getItem('srr_lang') || ''; } catch (e) {}
      if (l !== 'uz' && l !== 'en') {
        var n = (((navigator.languages && navigator.languages[0]) || navigator.language || '') + '').toLowerCase();
        l = n.indexOf('uz') === 0 ? 'uz' : 'en';
      }
      return l;
    })();
    function srrT(k) {
      var d = SRR_TXT[window.SRR_LANG] || SRR_TXT.en;
      return d[k] !== undefined ? d[k] : SRR_TXT.uz[k];
    }
    window.srrApplyLang = function (l) {
      if (l === 'uz' || l === 'en') window.SRR_LANG = l;
      try { document.documentElement.lang = window.SRR_LANG; } catch (e) {}
      function set(id, text) { var el = document.getElementById(id); if (el) el.textContent = text; }
      var fsb = document.getElementById('fs');
      if (fsb) { fsb.title = srrT('fullscreen'); fsb.setAttribute('aria-label', srrT('fullscreen')); }
      set('hz-tag', srrT('adTag')); set('hz-sub', srrT('houseSub')); set('rw-play', srrT('play'));
      set('rw-go', srrT('openAd')); set('rw-cancel', srrT('cancel'));
      set('rot-txt', srrT('rotate')); set('rot-play', srrT('rotPlay')); set('rot-skip', srrT('rotSkip'));
      if (typeof window.srrRefreshHouseBanner === 'function') window.srrRefreshHouseBanner();
    };
    window.srrApplyLang(window.SRR_LANG);
  </script>

  <template id="kod-monetag-inpage"><script>(function(s){s.dataset.zone='12159717',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script></template>

  <!-- Playgama Bridge SDK (portal reklamasi). Yuklanmasa ham o'yin ishlayveradi. -->
  <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
  <script src="Build/Web.loader.js"></script>
  <script>
    var canvas = document.querySelector('#unity-canvas');
    var stage = document.querySelector('#stage');
    var cont = document.querySelector('#unity-container');

    // Oyna o'lchamiga qarab 16:9 maydon
    function layout() {
      var r = stage.getBoundingClientRect();
      var w = Math.min(r.width, r.height * 16 / 9);
      cont.style.width = Math.floor(w) + 'px';
      cont.style.height = Math.floor(w * 9 / 16) + 'px';
    }
    layout();
    window.addEventListener('resize', layout);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);

    // Sahifa strelkalar/probel bilan siljib ketmasin; o'ng tugma menyusi chiqmasin
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].indexOf(e.key) >= 0) e.preventDefault();
    }, { passive: false });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    canvas.addEventListener('pointerdown', function () { canvas.focus(); });

    var config = {
      dataUrl: "Build/Web.data.unityweb",
      frameworkUrl: "Build/Web.framework.js.unityweb",
      codeUrl: "Build/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Tapvora Games",
      productName: "Silk Road Rumble",
      productVersion: "0.2.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
    };

    // ----- Reklama ko'prigi (WebAds.jslib shuni chaqiradi) -----
    function toUnity(method, value) {
      try {
        if (!window.unityInstance) return;
        if (value === undefined) window.unityInstance.SendMessage('AdManager', method);
        else window.unityInstance.SendMessage('AdManager', method, String(value));
      } catch (e) {}
    }

    // 0) GAMEMONETIZE: o'yin gamemonetize.com da ochilganda (yoki GameMonetize build'ida,
    //    yoki test uchun manzil oxirida ?gm bo'lsa) reklamani GameMonetize SDK ko'rsatadi.
    //    Bu rejimda Playgama, Monetag, Adsterra va o'z reklamamiz ishlamaydi (portal qoidasi).
    var GM_GAME_ID = 'om2fro36n3nbef9euz1wbp8dknj6fzpb';
    var GM_MODE = window.SRR_PORTAL === 'gamemonetize' ||
                  /(^|\.)gamemonetize\.(com|co)$/.test(location.hostname) ||
                  /[?&]gm(=|&|$)/.test(location.search);
    var gm = { ready: false, unityLoaded: false, job: null, prerollDone: false, waitUntil: 0 };
    var GM_GAP_AFTER_AD = 60000;   // reklama ko'rsatilgach — keyingisigacha (GameMonetize tez-tez bermaydi)
    var GM_GAP_AFTER_FAIL = 20000; // reklama kelmasa — biroz kutib qayta urinamiz

    function gmActive() {
      return GM_MODE && gm.ready && typeof window.sdk !== 'undefined' && typeof sdk.showBanner === 'function';
    }

    // Tanaffus tugadimi ("Reklama ko'ring" tugmasi faqat shunda ko'rinadi)
    function gmCanShow() { return gmActive() && !gm.job && Date.now() >= gm.waitUntil; }

    // Reklama so'raladi. Natija: true — reklama haqiqatan ko'rsatildi, false — ko'rsatilmadi.
    function gmShowAd() {
      return new Promise(function (resolve) {
        if (!gmActive() || gm.job) { resolve(false); return; }
        var job = { shown: false, resolve: resolve, at: Date.now() };
        gm.job = job;
        try { sdk.showBanner(); } catch (e) { gm.job = null; resolve(false); return; }
        // 12 soniyada reklama boshlanmasa (reklama yo'q) — o'yin davom etadi
        setTimeout(function () {
          if (gm.job === job && !job.shown) { gm.job = null; gm.waitUntil = Date.now() + GM_GAP_AFTER_FAIL; resolve(false); }
        }, 12000);
      });
    }

    // O'yin ochilganda bitta reklama (GameMonetize o'yinlarida odatiy; tekshiruv uchun ham kerak)
    function gmPreroll() {
      if (gm.prerollDone || !gm.ready || !gm.unityLoaded) return;
      gm.prerollDone = true;
      gmShowAd();
    }

    if (GM_MODE) {
      window.SDK_OPTIONS = {
        gameId: GM_GAME_ID,
        onEvent: function (a) {
          switch (a.name) {
            case 'SDK_GAME_PAUSE': // reklama boshlandi — o'yin ovozi o'chadi
              console.log('[SRR] GM: SDK_GAME_PAUSE');
              if (gm.job) gm.job.shown = true;
              toUnity('OnWebAdOpened');
              toUnity('OnWebPauseChanged', 1);
              break;
            case 'SDK_GAME_START': // reklama tugadi — o'yin davom etadi
              toUnity('OnWebPauseChanged', 0);
              console.log('[SRR] GM: SDK_GAME_START');
              if (gm.job) {
                var j = gm.job; gm.job = null;
                // Ba'zan SDK PAUSE xabarini yubormaydi — reklama 3 soniyadan uzoq davom etgan bo'lsa, ko'rsatilgan deb hisoblaymiz
                if (!j.shown && Date.now() - j.at > 3000) j.shown = true;
                console.log('[SRR] GM: reklama ' + (j.shown ? "ko'rsatildi" : "kelmadi"));
                gm.waitUntil = Date.now() + (j.shown ? GM_GAP_AFTER_AD : GM_GAP_AFTER_FAIL);
                j.resolve(j.shown);
              }
              break;
            case 'SDK_READY':
              gm.ready = true;
              console.log('[SRR] GameMonetize SDK tayyor');
              gmPreroll();
              break;
          }
        }
      };
      (function (d, s, id) {
        var f = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        var js = d.createElement(s); js.id = id;
        js.src = 'https://api.gamemonetize.com/sdk.js';
        f.parentNode.insertBefore(js, f);
      })(document, 'script', 'gamemonetize-sdk');
      window.SRR_PORTAL = 'gamemonetize'; // WebPhone.jslib telefon-pultni o'chiradi
      console.log('[SRR] GameMonetize rejimi');
    }

    // 1) Playgama Bridge: portalda (platform.id 'mock' emas) reklamani portal ko'rsatadi
    var pg = { ready: false, unityLoaded: false, gameReadySent: false, rewarded: null, interstitial: null };

    function pgActive() {
      return pg.ready && window.bridge && bridge.platform && bridge.platform.id !== 'mock';
    }

    function pgSendGameReady() {
      if (pg.gameReadySent || !pg.ready || !pg.unityLoaded) return;
      pg.gameReadySent = true;
      try { bridge.platform.sendMessage('game_ready'); } catch (e) {}
    }

    if (window.bridge && !GM_MODE) {
      bridge.initialize().then(function () {
        pg.ready = true;
        console.log('[SRR] Playgama Bridge tayyor, platforma: ' + bridge.platform.id);

        // Mukofotli: 'rewarded' kelsa — mukofot; 'closed' / 'failed' — tugadi
        bridge.advertisement.on(bridge.EVENT_NAME.REWARDED_STATE_CHANGED, function (state) {
          var job = pg.rewarded;
          if (!job) return;
          if (state === 'opened') toUnity('OnWebAdOpened');
          else if (state === 'rewarded') job.granted = true;
          else if (state === 'closed' || state === 'failed') {
            pg.rewarded = null;
            if (job.granted) job.resolve(); else job.reject(state);
          }
        });

        // Interstitial: 'closed' yoki 'failed' — o'yin davom etadi
        bridge.advertisement.on(bridge.EVENT_NAME.INTERSTITIAL_STATE_CHANGED, function (state) {
          var job = pg.interstitial;
          if (!job) return;
          if (state === 'loading' || state === 'opened') {
            job.started = true;
            if (state === 'opened') toUnity('OnWebAdOpened');
          } else if (state === 'closed' || state === 'failed') {
            pg.interstitial = null;
            job.resolve();
          }
        });

        // Portal pauza / ovozni o'chirsa — o'yin ovozi ham o'chadi
        try {
          bridge.platform.on(bridge.EVENT_NAME.PAUSE_STATE_CHANGED, function (isPaused) {
            toUnity('OnWebPauseChanged', isPaused ? 1 : 0);
          });
          bridge.platform.on(bridge.EVENT_NAME.AUDIO_STATE_CHANGED, function (isEnabled) {
            toUnity('OnWebPauseChanged', isEnabled ? 0 : 1);
          });
        } catch (e) {}

        pgSendGameReady();
        if (window.srrAds && window.srrAds.banner) applyBanner();
      }).catch(function (e) {
        console.warn('[SRR] Playgama Bridge ishga tushmadi', e);
      });
    }

    // Brauzer tabi yashirilsa — ovoz o'chadi (portallar talabi)
    document.addEventListener('visibilitychange', function () {
      toUnity('OnWebPauseChanged', document.hidden ? 1 : 0);
    });

    // 2) O'Z SAYTINGIZ (tapvora.github.io) va localhost:
    //    Mukofotli: avval Monetag Direct Link tekshiriladi. Internet provayderi uni to'sgan
    //    bo'lsa — Tapvora Games o'z reklamasi (Astro Dodge) 5 soniya ko'rsatiladi.
    //    O'yinlar orasida: Tapvora Games reklamasi 5 soniya.
    var MONETAG_DIRECT_LINK = 'https://uplcm.com/4/12195927';
    var OWN_SITE = !GM_MODE && (/(^|\.)tapvora\.github\.io$/.test(location.hostname) ||
                   location.hostname === 'localhost' || location.hostname === '127.0.0.1');
    var MIN_AWAY_MS = 5000;     // Monetag tabida kamida shuncha
    var HOUSE_AD_SEC = 5;       // o'z reklamamiz davomiyligi

    // Monetag domeni ochiladimi? (to'silgan bo'lsa fetch xato beradi)
    var monetagOk = null;
    function probeMonetag() {
      if (monetagOk !== null) return Promise.resolve(monetagOk);
      return new Promise(function (res) {
        var t = setTimeout(function () { monetagOk = false; res(false); }, 3500);
        fetch(MONETAG_DIRECT_LINK, { mode: 'no-cors', cache: 'no-store', credentials: 'omit' })
          .then(function () { clearTimeout(t); monetagOk = true; res(true); })
          .catch(function () { clearTimeout(t); monetagOk = false; res(false); });
      });
    }
    if (OWN_SITE && MONETAG_DIRECT_LINK) probeMonetag().then(function (ok) {
      console.log('[SRR] Monetag ' + (ok ? 'ochiq' : "to'silgan — o'z reklamamiz ishlatiladi"));
    });

    function adBox(title) {
      var el = {
        box: document.getElementById('rw'), title: document.getElementById('rw-title'),
        house: document.getElementById('rw-house'), msg: document.getElementById('rw-msg'),
        go: document.getElementById('rw-go'), claim: document.getElementById('rw-claim'),
        cancel: document.getElementById('rw-cancel')
      };
      el.title.innerHTML = title;
      el.house.style.display = 'none';
      el.go.style.display = 'none'; el.claim.style.display = 'none'; el.cancel.style.display = '';
      el.claim.disabled = true; el.claim.textContent = srrT('claim');
      el.go.textContent = srrT('openAd'); el.cancel.textContent = srrT('cancel');
      el.go.onclick = el.claim.onclick = el.cancel.onclick = null;
      el.box.style.display = 'flex';
      return el;
    }

    // O'z reklamamiz: taymer tugagach tugma yoqiladi
    function runHouseAd(el, doneLabel, onTick) {
      el.house.style.display = 'block';
      el.go.style.display = 'none';
      el.claim.style.display = ''; el.claim.disabled = true; el.claim.textContent = doneLabel;
      var left = HOUSE_AD_SEC;
      el.msg.textContent = srrT('adCountdown') + left + ' s';
      var timer = setInterval(function () {
        left--;
        if (left > 0) { el.msg.textContent = srrT('adCountdown') + left + ' s'; return; }
        clearInterval(timer);
        el.msg.textContent = srrT('thanks');
        el.claim.disabled = false;
      }, 1000);
      return function stop() { clearInterval(timer); };
    }

    if (OWN_SITE) {
      window.monetagShowRewarded = function () {
        return new Promise(function (resolve, reject) {
          toUnity('OnWebAdOpened'); // o'yinchi qaror qilguncha "javob kelmadi" taymeri ishlamasin
          var el = adBox('&#127873; Bonus');
          var done = false, stopHouse = null, timer = null, openedAt = 0;
          el.msg.textContent = srrT('adLoading');

          function finish(ok) {
            if (done) return; done = true;
            el.box.style.display = 'none';
            if (stopHouse) stopHouse();
            clearInterval(timer);
            document.removeEventListener('visibilitychange', onVis);
            if (ok) resolve(); else reject('cancel');
          }
          function ready() { return openedAt && Date.now() - openedAt >= MIN_AWAY_MS; }
          function onVis() { if (!document.hidden && ready()) finish(true); }

          el.cancel.onclick = function () { finish(false); };
          el.claim.onclick = function () { if (!el.claim.disabled) finish(true); };

          function useHouse() {
            stopHouse = runHouseAd(el, srrT('claim3'));
          }

          probeMonetag().then(function (ok) {
            if (done) return;
            if (!ok) { useHouse(); return; }
            el.msg.textContent = srrT('adWatch');
            el.go.style.display = '';
            el.go.onclick = function () {
              var w = window.open(MONETAG_DIRECT_LINK, '_blank');
              if (!w) { useHouse(); return; } // oyna to'silsa — o'z reklamamiz
              try { w.opener = null; } catch (e) {}
              openedAt = Date.now();
              el.go.style.display = 'none'; el.claim.style.display = '';
              document.addEventListener('visibilitychange', onVis);
              timer = setInterval(function () {
                var left = Math.ceil((MIN_AWAY_MS - (Date.now() - openedAt)) / 1000);
                if (left > 0) { el.msg.textContent = srrT('adOpened') + left + ' s'; }
                else { el.msg.textContent = srrT('thanksClaim'); el.claim.disabled = false; clearInterval(timer); }
              }, 250);
            };
          });
        });
      };

      // O'yinlar orasida: o'z reklamamiz, 5 soniya
      window.monetagShowInterstitial = function () {
        return new Promise(function (resolve) {
          toUnity('OnWebAdOpened');
          var el = adBox(srrT('adTitle'));
          el.cancel.style.display = 'none';
          var stop = runHouseAd(el, srrT('cont'));
          el.claim.onclick = function () {
            if (el.claim.disabled) return;
            stop(); el.box.style.display = 'none'; resolve();
          };
        });
      };
      console.log("[SRR] O'z saytidagi reklama yoqildi");
    }

    function monetagRewarded() { return typeof window.monetagShowRewarded === 'function'; }
    function monetagInterstitial() { return typeof window.monetagShowInterstitial === 'function'; }

    window.srrAds = {
      rewardedReady: function () {
        // GameMonetize: tanaffusdan keyin (reklama kelmasa — 20 s, ko'rsatilsa — 60 s)
        if (GM_MODE) return gmCanShow();
        if (pgActive()) return !!bridge.advertisement.isRewardedSupported && !pg.rewarded;
        return monetagRewarded();
      },
      interstitialReady: function () {
        if (GM_MODE) return gmCanShow();
        if (pgActive()) return !!bridge.advertisement.isInterstitialSupported && !pg.interstitial;
        return monetagInterstitial();
      },
      showRewarded: function () {
        // GameMonetize: reklama oxirigacha ko'rsatilsa — bonus beriladi
        if (GM_MODE) return gmShowAd().then(function (shown) { if (!shown) throw 'no_ad'; });
        if (!pgActive()) return window.monetagShowRewarded();
        return new Promise(function (resolve, reject) {
          pg.rewarded = { granted: false, resolve: resolve, reject: reject };
          try { bridge.advertisement.showRewarded('bonus_ochko'); }
          catch (e) { pg.rewarded = null; reject(e); }
        });
      },
      showInterstitial: function () {
        if (GM_MODE) return gmShowAd();
        if (!pgActive()) return window.monetagShowInterstitial();
        return new Promise(function (resolve) {
          var job = { started: false, resolve: resolve };
          pg.interstitial = job;
          try { bridge.advertisement.showInterstitial('oyinlar_orasida'); }
          catch (e) { pg.interstitial = null; resolve(); return; }
          // Portal reklamani bermasa (masalan vaqt chegarasi) — 3 soniyadan keyin o'yin davom etadi
          setTimeout(function () {
            if (pg.interstitial === job && !job.started) { pg.interstitial = null; resolve(); }
          }, 3000);
        });
      }
    };

    // Banner kodlari sahifa pastidagi <template> bloklaridan o'qiladi
    function codeOf(id) { var t = document.getElementById(id); return t ? t.innerHTML.trim() : ''; }
    var ADSTERRA_BANNER_PC = codeOf('kod-adsterra-pc');
    var ADSTERRA_BANNER_PHONE = codeOf('kod-adsterra-telefon');
    var MONETAG_INPAGE = codeOf('kod-monetag-inpage');

    // Kod ichidagi <script> larni haqiqatan ishga tushiradi (innerHTML ishlatmaydi)
    function injectSnippet(html, target) {
      try {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('script').forEach(function (old) {
          var s = document.createElement('script');
          for (var i = 0; i < old.attributes.length; i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
          if (old.textContent) s.textContent = old.textContent;
          s.async = true;
          (target || document.body).appendChild(s);
        });
      } catch (e) { console.warn('[SRR] reklama kodi', e); }
    }

    var inpageLoaded = false;
    function loadInPage() {
      if (inpageLoaded || !OWN_SITE || !MONETAG_INPAGE.trim()) return;
      inpageLoaded = true;
      injectSnippet(MONETAG_INPAGE, document.body);
      console.log('[SRR] Monetag In-Page Push yuklandi');
    }

    // Adsterra banneri alohida iframe ichida (uning kodi document.write ishlatadi —
    // sahifaning o'zida ishlatilsa o'yin o'chib ketardi)
    function realBannerHtml() {
      var phone = window.innerWidth < 760;
      var code = (phone ? ADSTERRA_BANNER_PHONE : ADSTERRA_BANNER_PC) || ADSTERRA_BANNER_PHONE || ADSTERRA_BANNER_PC;
      if (!code.trim()) return '';
      var useSmall = phone || !ADSTERRA_BANNER_PC.trim();
      var w = useSmall ? 320 : 728, h = useSmall ? 50 : 90;
      var f = document.createElement('iframe');
      f.width = w; f.height = h; f.scrolling = 'no'; f.title = srrT('adTitle');
      f.setAttribute('srcdoc', '<!DOCTYPE html><html><head><base target="_blank"><style>html,body{margin:0;overflow:hidden;background:transparent}</style></head><body>' + code + '</body></html>');
      return f;
    }

    // ----- BANNER (faqat menyuda; Unity MenuScreen chaqiradi) -----
    var bannerWanted = false, bannerShown = false;
    function applyBanner() {
      if (pgActive()) {
        try {
          if (bannerWanted && !bannerShown && bridge.advertisement.isBannerSupported) {
            bridge.advertisement.showBanner('bottom', 'menu_banner'); bannerShown = true;
          } else if (!bannerWanted && bannerShown) {
            bridge.advertisement.hideBanner(); bannerShown = false;
          }
        } catch (e) { console.warn('[SRR] banner', e); }
        return;
      }
      if (!OWN_SITE) return;
      // O'z saytda: haqiqiy banner (Adsterra), bo'lmasa — Tapvora Games banneri
      var slot = document.getElementById('ad-banner-bottom');
      if (bannerWanted) loadInPage();
      var real = (bannerWanted && !bannerShown) ? realBannerHtml() : '';
      if (real) {
        slot.innerHTML = ''; slot.appendChild(real); bannerShown = true;
        // Provayder to'sgan bo'lsa (6 s ichida yuklanmasa) — o'z bannerimizga o'tamiz
        setTimeout(function () {
          if (!bannerShown || !slot.contains(real)) return;
          var filled = false;
          try { filled = !!real.contentDocument.querySelector('iframe, img, a, ins, video'); } catch (e) { filled = true; }
          if (!filled) { slot.innerHTML = ''; bannerShown = false; showHouseBanner(slot); }
        }, 6000);
      } else if (bannerWanted && !bannerShown) {
        showHouseBanner(slot);
      } else if (!bannerWanted && bannerShown) {
        slot.innerHTML = ''; bannerShown = false;
      }
    }
    function houseBannerHtml() {
      return '<a class="hb" href="https://tapvora.github.io/astrododge/" target="_blank" rel="noopener">' +
        '<span class="hb-tag">' + srrT('bannerTag') + '</span> &#128640; <b>ASTRO DODGE</b> — ' + srrT('bannerText') +
        ' <span class="hb-go">' + srrT('play') + '</span></a>';
    }
    function showHouseBanner(slot) {
      if (bannerWanted && !bannerShown) {
        slot.innerHTML = houseBannerHtml();
        bannerShown = true;
      } else if (!bannerWanted && bannerShown) {
        slot.innerHTML = ''; bannerShown = false;
      }
    }
    // Til almashsa (srrApplyLang) — ko'rinib turgan o'z bannerimiz ham yangi tilda
    window.srrRefreshHouseBanner = function () {
      var slot = document.getElementById('ad-banner-bottom');
      if (slot && slot.querySelector('.hb')) slot.innerHTML = houseBannerHtml();
    };
    window.srrAds.banner = function (show) { bannerWanted = !!show; applyBanner(); };

    // ----- To'liq ekran (butun sahifa — reklama oynalari ham ko'rinadi) va telefonda gorizontal -----
    function goFullscreen(lockLandscape) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      var p = null;
      try { if (req && !document.fullscreenElement && !document.webkitFullscreenElement) p = req.call(el); } catch (e) {}
      function lock() {
        try { if (lockLandscape && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
      }
      if (p && p.then) p.then(lock).catch(function () {}); else lock();
      setTimeout(layout, 300);
    }
    document.getElementById('rot-play').onclick = function () {
      goFullscreen(true);
      // Burilmasa (masalan iPhone) — o'yinchi o'zi buradi; xabar ko'rinib turadi
      setTimeout(function () {
        if (window.matchMedia('(orientation: landscape)').matches) document.body.classList.remove('rot-ok');
      }, 600);
    };
    document.getElementById('rot-skip').onclick = function () {
      document.body.classList.add('rot-ok'); // tik holatda ham o'ynash (kichikroq)
      setTimeout(layout, 50);
    };

    var fill = document.querySelector('#fill');
    var loadtxt = document.querySelector('#loadtxt');
    var loading = document.querySelector('#loading');
    var err = document.querySelector('#err');

    createUnityInstance(canvas, config, function (p) {
      fill.style.width = (p * 100) + '%';
      loadtxt.textContent = srrT('loading') + Math.round(p * 100) + '%';
    }).then(function (unityInstance) {
      window.unityInstance = unityInstance;
      pg.unityLoaded = true;
      pgSendGameReady();
      gm.unityLoaded = true;
      gmPreroll();
      loading.style.display = 'none';
      canvas.focus();
      document.querySelector('#fs').onclick = function () { goFullscreen(false); };
    }).catch(function (message) {
      loadtxt.style.display = 'none';
      err.style.display = 'block';
      err.textContent = srrT('loadFail') + message;
      console.error(message);
    });
  </script>
</body>
